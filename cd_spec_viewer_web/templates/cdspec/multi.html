{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="section">
  <div class="container">

    <h1 class="title">Select Multiple Runs</h1>
    <p class="subtitle">Choose one or more runs below.</p>

    <form method="get" action="{% url 'cdspec:multi_select' %}">
      <div class="box">

        {% if runs %}
          <label class="label">Available Runs</label>

          <div class="content">
            {% for run in runs %}
              <label class="checkbox">
                <input type="checkbox" name="run_ids" value="{{ run.id }}">
                <strong>{{ run.run_title }}</strong>
                <span class="has-text-grey">— {{ run.upload_date|date:"Y-m-d H:i" }}</span>
              </label>
              <br>
            {% endfor %}
          </div>

        {% else %}
          <p>No runs available.</p>
        {% endif %}

      </div>

      <div class="buttons">
        <a href="{% url 'cdspec:index' %}" class="button is-light">Back</a>
        <button type="submit" class="button is-primary">Continue</button>
      </div>

    </form>

  </div>
</section>
{% endblock %}
